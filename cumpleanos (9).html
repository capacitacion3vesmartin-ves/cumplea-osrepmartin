<style>

table{min-width:1100px!important}

.fcw{display:flex;align-items:center;gap:6px}.fcb{display:flex;flex-direction:column;gap:3px;align-items:flex-start}.fcw .th{margin:0;width:42px;height:42px}
td input.bad{border-color:#e11d48!important}

#ts.tl{background:#fff;color:#6d1b8f}#ts.ok{background:#16a34a;color:#fff}#ts.er{background:#e11d48;color:#fff}
.fbw{margin-bottom:14px}.fbw .fb{margin-bottom:0}.fbt{display:none}

</style></head><body>
<div class="bn"><a class="vb" href="https://capacitacion3vesmartin-ves.github.io/campuscapacitacion/">← Campus</a><span>CUMPLEAÑOS</span></div>
<div class="bun"></div><div id="bl"></div>
<div id="app"></div>

<div id="md" class="md"></div><div id="ts"></div>
<script>
/* URL del Apps Script de CUMPLEAÑOS (termina en /exec). */
const URL_API='https://script.google.com/macros/s/AKfycbw_5WQZHxiSAtPH7tyKxk5k9q9SOXKNOfcGabT5dtlYMSx1pzPt8nlcUdiTSW1KHobhig/exec';
const SEDES=[['Villa el Salvador','#db2777'],['Puente Piedra','#7c3aed'],['Arequipa','#ea580c'],['Piura','#0d9488']];
const AREAS=['Ventas','Optimización','Carteras'];
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],DS=['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let SEDE=null,ITEMS=[],ST='idle',TK='',MSEDE='',CM=0,CY=0,ROWS=[];
const colDe=n=>(SEDES.find(s=>s[0]==n)||[0,'#86198f'])[1];
let TT;
const msg=(t,c)=>{const m=$('#mm');if(m){m.textContent=t;m.className='ms '+(c||'')}
 const o=$('#ts');if(!o)return;clearTimeout(TT);if(!t){o.style.display='none';return}
 o.textContent=t;o.className=c=='ld'?'tl':c=='ok'?'ok':'er';o.style.display='block';if(c!='ld')TT=setTimeout(()=>{o.style.display='none'},3500)};
const busy=b=>document.querySelectorAll('#md .bt').forEach(x=>x.disabled=b);
async function api(p){
 if(URL_API.startsWith('PEGA'))throw new Error('Falta conectar la base de datos (URL del Apps Script).');
 let j;try{const r=await fetch(URL_API,{method:'POST',body:JSON.stringify(p)});j=await r.json()}catch(e){throw new Error('No hay conexión con el servidor. Intenta de nuevo.')}
 if(!j.ok){if(j.codigo=='SESION'){TK='';MSEDE='';R()}throw new Error(j.error||'Error del servidor')}
 return j}
function modal(h,col,cls){DX=DY=0;const m=$('#md');m.innerHTML='<div class="mc '+(cls||'')+'" style="--c:'+(col||'#86198f')+'">'+h+'</div>';m.style.display='flex'}
function cerrar(){$('#md').style.display='none';$('#md').innerHTML=''}
const X='<button class="x" data-a="cerrar">×</button>';

/* ===== Fechas ===== */
const hoy=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const md=f=>{const q=String(f).split('-');return{m:+q[1]-1,d:+q[2]}};
const FM=f=>{const o=md(f);return o.d+' '+MES[o.m].slice(0,3).toLowerCase()};
function dias(f){const t=hoy(),o=md(f);let n=new Date(t.getFullYear(),o.m,o.d);if(n<t)n=new Date(t.getFullYear()+1,o.m,o.d);return Math.round((n-t)/864e5)}

/* ===== Datos ===== */
async function cargar(){ST='load';R();try{const j=await api({accion:'listar',sede:SEDE,token:TK});ITEMS=j.items;ST='ok'}catch(e){ST='err'}R()}

/* ===== Vistas ===== */
function R(){$('#app').innerHTML=SEDE?vista():bienvenida();$('#mbtn').style.display=TK?'none':'block';if(SEDE&&ST=='ok')pintaRes()}
function bienvenida(){return '<h1>🎂 Cumpleaños 🎉</h1><p class="sub">¡Elige tu sede y celebremos!</p><div class="sg">'+SEDES.map(s=>'<button class="sd" style="--c:'+s[1]+'" data-a="sede" data-s="'+E(s[0])+'"><i>🎈</i><span>'+E(s[0])+'<small>¡Ver quién cumple!</small></span></button>').join('')+'</div>'}
const av=x=>x.foto?'<img class="av" src="'+E(x.foto)+'" alt="" referrerpolicy="no-referrer" loading="lazy">':'';
const avg=x=>x.foto?'<img class="avg" src="'+E(x.foto)+'" alt="" referrerpolicy="no-referrer">':'';
const tarj=x=>'<div class="it">'+av(x)+'<b>'+E(x.asesor)+'</b>'+arC(x.area)+'<small>🎂 '+FM(x.fecha)+(x.sabores?' · 🍰 '+E(x.sabores):'')+'</small>'+(x.apuntes?'<small>📝 '+E(x.apuntes)+'</small>':'')+'</div>';
const nz=t=>String(t==null?'':t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const arK=a=>{const k=nz(a);return k=='ventas'?'v':k=='optimizacion'?'o':k=='carteras'?'c':'x'};
const arC=a=>a?'<span class="ar ar-'+arK(a)+'">'+E(a)+'</span>':'';
let FQ='',FA='',FS='',FMO='',FBO=false;
const sabs=()=>{const m=new Map();ITEMS.forEach(x=>String(x.sabores||'').split(/[,;\/]|\sy\s/i).forEach(t=>{t=t.trim();if(t&&!m.has(nz(t)))m.set(nz(t),t)}));return[...m.values()].sort((a,b)=>a.localeCompare(b))};
const filtra=L=>L.filter(x=>(!FQ||nz(x.asesor).includes(nz(FQ)))&&(!FA||nz(x.area)==nz(FA))&&(!FS||nz(x.sabores).includes(nz(FS)))&&(FMO===''||md(x.fecha).m==+FMO));
const pcard=x=>'<div class="pc" data-a="persona" data-id="'+E(x.id)+'">'+av(x)+'<b>'+E(x.asesor)+'</b><small>'+FM(x.fecha)+' · '+(x.dd==0?'¡hoy!':x.dd==1?'mañana':'en '+x.dd+' días')+'</small><small>'+arC(x.area)+(x.sabores?' 🍰 '+E(x.sabores):'')+'</small></div>';
function barra(){const ar=[...new Set(ITEMS.map(x=>x.area).filter(Boolean))].sort();
 const act=!!(FQ||FA||FS||FMO!=='');

function pintaRes(){const L=ITEMS.map(x=>Object.assign({dd:dias(x.fecha)},x)),act=!!(FQ||FA||FS||FMO!==''),FL=filtra(L).sort((a,b)=>a.dd-b.dd);

function vista(){
 const top='<div class="tb"><span class="chip" style="--c:'+colDe(SEDE)+'">'+E(SEDE)+'</span><button class="bt w" data-a="cambiar">Cambiar sede</button></div>'
  +(TK&&MSEDE==SEDE?'<div class="mbar">🔓 Master de '+E(MSEDE)+'<span class="sp"></span><button class="bt" data-a="gestion">✏️ Agregar / editar cumpleaños</button><button class="bt w" data-a="salir">Salir</button></div>':'');
 if(ST=='load'||ST=='idle')return top+'<div class="st ld">Cargando cumpleaños</div>';

 const L=ITEMS.map(x=>Object.assign({dd:dias(x.fecha)},x)),H=L.filter(x=>x.dd==0),P=L.filter(x=>x.dd>0&&x.dd<=30).sort((a,b)=>a.dd-b.dd);

  +(H.length?'<div class="hoy"><div class="hh">🎉 ¡Hoy está de cumpleaños!</div>'+H.map(x=>'<div class="hn">'+avg(x)+'🎂 '+E(x.asesor)+'<small>'+arC(x.area)+(x.sabores?' 🍰 '+E(x.sabores):'')+'</small></div>').join('')+'</div>':'<div class="hoy no"><div class="hh">🎈 Hoy no hay cumpleaños</div></div>')
  +barra()

 for(let i=0;i<first;i++)h+='<div class="cd e"></div>';
 for(let d=1;d<=n;d++){
  const li=L.filter(x=>{const o=md(x.fecha);return o.m==m&&o.d==d}),es=t.getFullYear()==y&&t.getMonth()==m&&t.getDate()==d;
  h+='<div class="cd'+(es?' hy':'')+(li.length?' bd" data-a="dia" data-d="'+d:'')+'"><span>'+d+'</span>'+li.slice(0,2).map(x=>'<em class="e-'+arK(x.area)+'">'+E(x.asesor.split(' ')[0])+'</em>').join('')+(li.length>2?'<em>+'+(li.length-2)+'</em>':'')+'</div>'}

function loginM(){modal(X+'<h3>Acceso master</h3><p class="ds">Solo podrás editar los cumpleaños de tu sede.</p><label>Clave<div class="pw"><input id="mp" type="password" autocomplete="new-password" placeholder="Clave"><button type="button" data-a="ojo">Ver</button></div></label><div id="mm" class="ms"></div><div class="fx"><button class="bt w" data-a="cerrar">Cancelar</button><button class="bt" data-a="entrar">Entrar</button></div>','#111827')}
async function entrar(){const c=$('#mp').value.trim();if(!c){msg('Escribe la clave.');return}msg('Verificando…','ld');busy(true);
 try{const j=await api({accion:'login',clave:c});TK=j.token;MSEDE=SEDE=j.sede;const n=new Date();CM=n.getMonth();CY=n.getFullYear();cerrar();cargar()}catch(e){busy(false);msg(e.message)}}

const areas=()=>[...new Set(AREAS.concat(ITEMS.map(x=>x.area).filter(Boolean)))];
const nueva=()=>({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),dni:'',asesor:'',area:'',fecha:'',sabores:'',apuntes:'',foto:'',n:1,d:1});
const inp=(k,v,i,ex)=>'<input data-k="'+k+'" value="'+E(v)+'" '+(ex||'')+'>';
const fotoCel=(r,i)=>'<td class="fc"><div class="fcw">'+(r.foto?'<img class="th" src="'+E(r.foto)+'" alt="" referrerpolicy="no-referrer">':'')+'<div class="fcb"><button class="bt w sm" data-a="foto" data-i="'+i+'">📷 '+(r.foto?'Cambiar':'Subir')+'</button>'+(r.foto?'<button class="bt r sm" data-a="qfoto" data-i="'+i+'">Quitar</button>':'')+'</div></div></td>';
const pad=n=>String(n).padStart(2,'0');
const mesIdx=v=>{v=nz(v).trim();if(!v)return -1;if(/^\d+$/.test(v)){const n=+v;return n>=1&&n<=12?n-1:-1}
 if(/^set/.test(v))return 8;const ex=MES.findIndex(m=>nz(m)==v);if(ex>=0)return ex;
 const c=MES.map((m,i)=>nz(m).startsWith(v)?i:-1).filter(i=>i>=0);return c.length==1?c[0]:-1};
const fechaCel=f=>{const q=String(f||'').split('-'),m=+q[1]||0,d=+q[2]||0;
 return '<div style="display:flex;gap:4px"><input data-k="dia" inputmode="numeric" maxlength="2" placeholder="Día" value="'+(d||'')+'" style="width:52px;text-align:center"><input data-k="mes" list="mesl" placeholder="Mes" value="'+(m?MES[m-1]:'')+'" style="width:112px" autocomplete="off"></div>'};
function aplicaQ(){const q=nz(($('#mq')||{}).value||'');let n=0;document.querySelectorAll('#tbd tr').forEach(tr=>{const r=ROWS[+tr.dataset.i],ok=!q||nz([r.asesor,r.dni,r.area,r.sabores,r.apuntes].join(' ')).includes(q);tr.style.display=ok?'':'none';if(ok)n++});const c=$('#mqn');if(c)c.textContent=n+' de '+ROWS.length}
const fila=(r,i)=>'<tr data-i="'+i+'"><td>'+E(SEDE)+'</td><td>'+inp('dni',r.dni,i,'maxlength="8" inputmode="numeric" placeholder="8 dígitos" style="width:100px"')+'</td><td>'+inp('asesor',r.asesor,i,'maxlength="80" placeholder="Nombre y apellido"')+'</td><td>'+inp('area',r.area,i,'list="ars" maxlength="40" placeholder="Elige o escribe" style="width:140px"')+'</td><td>'+fechaCel(r.fecha)+'</td><td>'+inp('sabores',r.sabores,i,'maxlength="120" placeholder="Ej. Chocolate"')+'</td><td>'+inp('apuntes',r.apuntes,i,'maxlength="300"')+'</td>'+fotoCel(r,i)+'<td><button class="bt r" data-a="delf" data-i="'+i+'" title="Borrar">✕</button></td></tr>';
const refrescar=()=>{$('#tbd').innerHTML=ROWS.map(fila).join('');aplicaQ()};
function gestion(){ROWS=ITEMS.map(x=>Object.assign({},x));if(!ROWS.length)ROWS.push(nueva());
 modal(X+'<button class="bt w" data-a="max" id="mxb" style="position:absolute;top:12px;right:52px;padding:5px 12px">Ampliar</button><h3 title="Arrastra para mover">🎂 Cumpleaños de '+E(SEDE)+'</h3><p class="ds">Edita cualquier celda y pulsa «Guardar cambios». Arrastra el título para mover la ventana; usa «Ampliar» o la esquina inferior derecha para cambiar su tamaño.</p><div class="mq"><input id="mq" type="search" placeholder="🔎 Buscar por nombre, DNI, área o sabor…" autocomplete="off"><b id="mqn" style="white-space:nowrap;font-size:13px;color:var(--mu)"></b></div><div class="tw"><table><thead><tr><th>Sede</th><th>DNI</th><th>Asesor(a)</th><th>Área</th><th>Cumpleaños</th><th>Sabor de torta</th><th>Otros apuntes</th><th>Foto (opcional)</th><th></th></tr></thead><tbody id="tbd">'+ROWS.map(fila).join('')+'</tbody></table></div><datalist id="mesl">'+MES.map(m=>'<option value="'+m+'">').join('')+'</datalist><input id="fi" type="file" accept="image/*" style="display:none"><datalist id="ars">'+areas().map(a=>'<option value="'+E(a)+'">').join('')+'</datalist><div class="fx" style="justify-content:space-between"><div><button class="bt w" data-a="addf">+ Fila</button> <button class="bt w" data-a="addf5">+ 5 filas</button></div><div><button class="bt w" data-a="cerrar">Cerrar</button> <button class="bt" data-a="gdr">Guardar cambios</button></div></div><div id="mm" class="ms"></div>',colDe(SEDE),'wd2');aplicaQ()}
function addf(n){const q=$('#mq');if(q)q.value='';for(let i=0;i<n;i++)ROWS.push(nueva());refrescar();const w=$('.tw');w.scrollTop=w.scrollHeight}
async function gdr(){
 const L=ROWS.filter(r=>r.d&&!(r.n&&!r.asesor.trim()&&!r.dni&&!r.fecha));
 if(!L.length){msg('No hay cambios para guardar.');return}
 for(const r of L){const k=ROWS.indexOf(r)+1;
  if(!r.asesor.trim()){msg('Fila '+k+': falta el nombre del asesor(a).');return}
  if(!/^\d{8}$/.test(r.dni)){msg('Fila '+k+': el DNI debe tener 8 dígitos.');return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(r.fecha)){msg('Fila '+k+': escribe el día (1-31) y un mes válido.');return}
  const q=r.fecha.split('-');if(new Date(2000,+q[1]-1,+q[2]).getMonth()!=+q[1]-1){msg('Fila '+k+': esa fecha no existe.');return}}
 msg('Guardando…','ld');busy(true);
 try{await api({accion:'guardar',token:TK,filas:L.map(r=>({id:r.id,dni:r.dni,asesor:r.asesor.trim(),area:r.area.trim(),fecha:r.fecha,sabores:r.sabores.trim(),apuntes:r.apuntes.trim(),foto:r.foto||''}))});
  const j=await api({accion:'listar',sede:SEDE,token:TK});ITEMS=j.items;ROWS=ITEMS.map(x=>Object.assign({},x));R();refrescar();busy(false);msg('✔ Cambios guardados','ok')}
 catch(e){busy(false);msg(e.message)}}
async function delf(i){const r=ROWS[i];
 if(r.n){ROWS.splice(i,1);refrescar();return}
 if(!confirm('¿Borrar el cumpleaños de '+r.asesor+'?'))return;
 msg('Borrando…','ld');
 try{await api({accion:'borrar',token:TK,id:r.id});ROWS.splice(i,1);ITEMS=ITEMS.filter(x=>x.id!=r.id);R();refrescar();msg('')}catch(e){msg(e.message)}}

let DX=0,DY=0,DR=null;
/* ===== Foto opcional (se guarda en Drive) ===== */
let FROW=-1;
function comprimir(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=()=>no(new Error('No se pudo leer la imagen'));
 fr.onload=()=>{const im=new Image();im.onerror=()=>no(new Error('El archivo no es una imagen válida'));
  im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};
  im.src=fr.result};fr.readAsDataURL(file)})}
async function subirFoto(file){const i=FROW;if(!file||i<0||!ROWS[i])return;if(!/^image\//.test(file.type)){msg('Elige un archivo de imagen.');return}
 msg('Subiendo foto…','ld');busy(true);
 try{const d=await comprimir(file),j=await api({accion:'subir',token:TK,datos:d.split(',')[1],nombre:ROWS[i].asesor||'foto'});
  ROWS[i].foto=j.url;ROWS[i].d=1;refrescar();msg('Foto subida. Pulsa «Guardar cambios» para confirmar.','ok')}
 catch(e){msg(e.message)}busy(false)}
document.addEventListener('change',e=>{const t=e.target;
 if(t.id=='fi'){subirFoto(t.files[0]);t.value=''}
 else if(t.dataset.k=='mes'){const i=mesIdx(t.value);if(i>=0)t.value=MES[i];t.classList.toggle('bad',!!t.value&&i<0)}
 else if(t.dataset.k=='dia'){const n=parseInt(t.value,10);t.classList.toggle('bad',!!t.value&&!(n>=1&&n<=31))}
 else if(t.id=='fa'){FA=t.value;pintaRes()}else if(t.id=='fs'){FS=t.value;pintaRes()}
 else if(t.id=='fo'){FMO=t.value;if(FMO!=='')CM=+FMO;pintaRes()}});

/* ===== Eventos ===== */
const A={
 sede:t=>{SEDE=t.dataset.s;const n=new Date();CM=n.getMonth();CY=n.getFullYear();cargar()},
 cambiar:()=>{SEDE=null;ITEMS=[];R()},cargar:()=>cargar(),
 mp:()=>{if(--CM<0){CM=11;CY--}R()},mn:()=>{if(++CM>11){CM=0;CY++}R()},
 dia:t=>dia(+t.dataset.d),mus:toggleMus,persona:t=>{const x=ITEMS.find(y=>y.id==t.dataset.id);if(!x)return;const o=md(x.fecha);modal(X+'<h3>🎂 '+o.d+' de '+MES[o.m]+'</h3>'+tarj(x)+'<div class="fx"><button class="bt" data-a="cerrar">Cerrar</button></div>',colDe(SEDE))},fbt:()=>{FBO=!FBO;$('.fbw').classList.toggle('open',FBO);$('.fbt').textContent=(FBO?'Ocultar filtros':'Mostrar buscador y filtros')+((FQ||FA||FS||FMO!=='')?' · activos':'')},max:()=>{const m=$('.mc'),b=$('#mxb');m.classList.toggle('mx');m.style.transform='';DX=DY=0;b.textContent=m.classList.contains('mx')?'Reducir':'Ampliar'},limpiar:()=>{FQ=FA=FS='';FMO='';R()},foto:t=>{FROW=+t.dataset.i;$('#fi').click()},qfoto:t=>{const r=ROWS[+t.dataset.i];r.foto='';r.d=1;refrescar()},master:loginM,entrar:entrar,salir:salir,cerrar:cerrar,gestion:gestion,
 ojo:()=>{const i=$('#mp');i.type=i.type=='password'?'text':'password'},
 addf:()=>addf(1),addf5:()=>addf(5),gdr:gdr,delf:t=>delf(+t.dataset.i)};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t){if(e.target.id=='md')cerrar();return}const f=A[t.dataset.a];if(f)f(t)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id=='fq'){FQ=t.value.trim();pintaRes();return}
 if(t.id=='mq'){aplicaQ();return}
 const k=t.dataset.k,tr=t.closest('tr[data-i]');if(!k||!tr)return;const r=ROWS[+tr.dataset.i];
 if(k=='dia'||k=='mes'){if(k=='dia')t.value=t.value.replace(/\D/g,'').slice(0,2);
  const d=parseInt(tr.querySelector('[data-k=dia]').value,10),m=mesIdx(tr.querySelector('[data-k=mes]').value);
  r.fecha=(d>=1&&d<=31&&m>=0)?((String(r.fecha||'').split('-')[0])||'2000')+'-'+pad(m+1)+'-'+pad(d):'';r.d=1;return}
 if(k=='dni')t.value=t.value.replace(/\D/g,'');r[k]=t.value;r.d=1});
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.wd2 h3');if(!h||h.closest('.mx'))return;DR={x:e.clientX-DX,y:e.clientY-DY,m:h.closest('.mc')};try{h.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{if(!DR)return;DX=e.clientX-DR.x;DY=e.clientY-DR.y;DR.m.style.transform='translate('+DX+'px,'+DY+'px)'});
document.addEventListener('pointerup',()=>{DR=null});
document.addEventListener('keydown',e=>{if(e.key=='Escape')cerrar();if(e.key=='Enter'&&e.target.id=='mp')entrar()});
/* ===== Música: "Cumpleaños feliz" sintetizada (sin archivos) y globos ===== */
const SONG=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],[392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1],[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2],[0,2]];
let AC=null,MG=null,NI=0,NT=0,TM=null,MOFF=false;
try{MOFF=localStorage.getItem('cu_mus')=='off'}catch(e){}
const paintMus=()=>{$('#mus').textContent=(MOFF?'🔇':'🎵')+' Música'};
function nota(f,t,d,v){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.16,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);o2.connect(g);g.connect(MG);o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05)}
const BAJO={0:130.81,6:98,12:130.81,19:87.31};
function sched(){while(NT<AC.currentTime+1){const n=SONG.length,k=NI%n,q=SONG[k],d=q[1]*.64;
 if(q[0])nota(q[0],NT,Math.max(d*1.6,.6));
 if(Math.floor(NI/n)%2==1&&BAJO[k]){nota(BAJO[k],NT,2.4,.12);nota(BAJO[k]*2,NT+.02,2,.05)}
 NT+=d;NI++}}
function musOn(){if(MOFF||TM)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(!MG){MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination)}AC.resume();NT=AC.currentTime+.1;TM=setInterval(sched,250);sched()}catch(e){}}
function musOff(){clearInterval(TM);TM=null;if(AC)AC.suspend()}
function toggleMus(){MOFF=!MOFF;try{localStorage.setItem('cu_mus',MOFF?'off':'on')}catch(e){}MOFF?musOff():musOn();paintMus()}
document.addEventListener('click',e=>{if(!e.target.closest('#mus'))musOn()});
$('#bl').innerHTML=['#ff4d8d','#ffc300','#2bb7f5','#7bd36b','#a67bff','#fb8500','#ff4d8d','#2bb7f5','#ffc300','#7bd36b'].map((c,i)=>'<span class="bo" style="--c:'+c+';left:'+(5+i*10)+'%;--t:'+(16+i%4*4)+'s;--d:-'+(i*2.3)+'s"></span>').join('');
paintMus();
R();
